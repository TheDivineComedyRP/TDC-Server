name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build (esbuild)
        run: npm run build
        env:
          SKYMP_GAMEMODE: dist/gamemode.js